# GoalBuddy v2 state.yaml
version: 2

goal:
  title: "ZANA Rust-First MVP and Android Agent Build"
  slug: "zana-mvp"
  kind: existing_plan
  tranche: "Rust-first Core migration, Android agent target, and complete mandatory acceptance"
  status: active
  intake:
    original_request: "Execute the controlling ZANA build plan end to end after adopting Appoint Me agent-management architecture, using real DeepSeek agents and real local functionality until all mandatory acceptance criteria pass."
    interpreted_outcome: "A verified Rust-first ZANA product with desktop control plane, real local-model discovery, platform-neutral capability/build/evaluation/Image/Instance/portability lifecycle, and an Android local-agent execution target that does not require Python."
    input_shape: existing_plan
    audience: "ZANA desktop users and owner/operator"
    authority: approved
    proof_type: test
    completion_proof: "All mandatory criteria in 25_ACCEPTANCE_CRITERIA.md pass; the authoritative shipped Core is Rust and Python-free; Android safely imports and runs a compatible ZANA Image with permission-gated local actions; medical, Kurdish/language learning, and other knowledge capabilities remain functional; and a final audit declares full_outcome_complete: true."
    likely_misfire: "Performing a cosmetic Rust rewrite or Android demo while retaining Python as the real Core, losing accepted security semantics, hard-coding Android into Images, or breaking general medical/language/knowledge use cases."
    blind_spots_considered:
      - "External plan compatibility with current repository state"
      - "Actual installed DeepSeek profile names and availability"
      - "Cross-workstream interface and merge hazards"
      - "Desktop/runtime prerequisites and missing local model runtimes"
      - "Export/import safety and acceptance-test coverage"
      - "Parity risk while porting roughly 47k lines of accepted Python product logic"
      - "Android Play-policy, permission, OEM, battery, thermal, and lifecycle limits"
      - "Gated FunctionGemma license/access and exact mobile runtime format"
    existing_plan_facts:
      - "00_READ_FIRST.md is controlling and all referenced ZANA files must be followed recursively."
      - "Inspect and adopt relevant Appoint Me Agent Instructions and Handoffs before implementation."
      - "Expose installed DeepSeek V4/Flash/Max profiles as visible first-class Codex agents where available."
      - "Parallel agents require strict disjoint ownership/worktrees/handoffs and quiet status reporting."
      - "No mockups, placeholders, or fake data."
      - "Continue until every mandatory criterion in 25_ACCEPTANCE_CRITERIA.md passes."
      - "Founder directive 2026-08-11: migrate the authoritative product Core to Rust now; do not ship Python as the MVP Core."
      - "Founder directive 2026-08-11: add Android as a first-class local-agent target while retaining all platform-neutral capability use cases."
      - "Founder explicitly authorizes one small FunctionGemma download/load/compatibility test only after strict host and artifact preflight."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 6
  implementation_agent_policy: "Only opencode-go/deepseek-v4-flash with reasoning effort max; never DeepSeek V4 Pro."
  implementation_agents_visible_first_class_only: true
  writer_preflight_required: "Verify canonical repo, HEAD, branch, remote, status, worktree, and exclusive owner before every writer scope."
  milestone_acceptance_gate: "Implementation, focused tests, inspection/review, readability refactor, security/error paths, and relevant integration checks must all pass."
  accepted_commit_policy: "Exactly one focused commit per accepted feature/fix, then prove clean index and responsible worktree before advancing."
  safe_push_policy: "Fetch/reconcile, never force, confirm remote SHA; if unauthorized or blocked, record the blocker and never claim push success."
  parallel_workers_require_disjoint_scopes: true
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  current_host_safety_policy: "Use smallest focused Rust/Kotlin/TypeScript unit/static/type/lint/format checks by default. The Founder has re-enabled exactly one bounded FunctionGemma 270M artifact download/load/compatibility smoke after exact license/access, SHA-256, >=20 GiB free disk, >=50% system memory free, no swap activity, one process, bounded timeout, and deterministic cleanup. Broad/full, other live providers/models, browser/device/app/native bundle, training, load, container, or performance tests remain disabled until separately re-enabled."
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: installed
  worker: installed
  judge: installed
  deepseek_v4_flash: available_as_router_profile
  deepseek_v4_pro: installed_but_prohibited_for_zana
  deepseek_max: required_flash_reasoning_effort_not_a_separate_model

environment:
  implementation_state: founder_approved_rust_first_migration_and_android_target_active
  repo_is_git: true
  host: "macOS ARM64, Apple M2 Pro, 16 GB RAM"
  disk_free_gib_observed: 32.0
  toolchains_present:
    - "Python 3.12 + uv"
    - "Node + pnpm"
    - "Rust/Cargo"
    - "Xcode"
  live_runtime_state: "Ollama 0.32.6 and three compact local model blobs are installed, but the service is stopped after the host watchdog restart; no model, inference, build, or training process is running."
  acquisition_rule: "FunctionGemma repository metadata reports a gated 288,440,320-byte tiny_garden.litertlm with SHA-256 c0b243c22553d4cb8451eade37710199b33b9002c58752efc0094e0fed5ad1c2. Download is BLOCKED until the owner accepts the Gemma license and supplies authenticated access; never bypass gating or substitute another model."

