# GoalBuddy v2 state.yaml
version: 2

goal:
  title: "ZANA MVP End-to-End Build"
  slug: "zana-mvp"
  kind: existing_plan
  tranche: "continuous execution through complete mandatory acceptance"
  status: active
  intake:
    original_request: "Execute the controlling ZANA build plan end to end after adopting Appoint Me agent-management architecture, using real DeepSeek agents and real local functionality until all mandatory acceptance criteria pass."
    interpreted_outcome: "A verified functional ZANA desktop MVP with backend, real local-model discovery, capability build/evaluation, ZANA Image/instance lifecycle, and export/import."
    input_shape: existing_plan
    audience: "ZANA desktop users and owner/operator"
    authority: approved
    proof_type: test
    completion_proof: "All mandatory criteria in 25_ACCEPTANCE_CRITERIA.md pass with reproducible real end-to-end verification and a final audit declaring full_outcome_complete: true."
    likely_misfire: "Stopping at architecture, scaffolding, mocks, fake data, or a polished UI that does not complete the real local-model and artifact lifecycle."
    blind_spots_considered:
      - "External plan compatibility with current repository state"
      - "Actual installed DeepSeek profile names and availability"
      - "Cross-workstream interface and merge hazards"
      - "Desktop/runtime prerequisites and missing local model runtimes"
      - "Export/import safety and acceptance-test coverage"
    existing_plan_facts:
      - "00_READ_FIRST.md is controlling and all referenced ZANA files must be followed recursively."
      - "Inspect and adopt relevant Appoint Me Agent Instructions and Handoffs before implementation."
      - "Expose installed DeepSeek V4/Flash/Max profiles as visible first-class Codex agents where available."
      - "Parallel agents require strict disjoint ownership/worktrees/handoffs and quiet status reporting."
      - "No mockups, placeholders, or fake data."
      - "Continue until every mandatory criterion in 25_ACCEPTANCE_CRITERIA.md passes."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 6
  parallel_workers_require_disjoint_scopes: true
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true

agents:
  scout: installed
  worker: installed
  judge: installed
  deepseek_v4_flash: available_as_router_profile
  deepseek_v4_pro: available_as_router_profile
  deepseek_max: unavailable_not_configured_max_is_reasoning_effort

environment:
  implementation_state: M2_domain_database_job_and_api_contracts_verified
  repo_is_git: true
  host: "macOS ARM64, Apple M2 Pro, 16 GB RAM"
  disk_free_gib_observed: 23.0
  toolchains_present:
    - "Python 3.12 + uv"
    - "Node + pnpm"
    - "Rust/Cargo"
    - "Xcode"
  live_runtime_state: "Ollama 0.32.6 and three compact local model blobs are installed, but the service is stopped after the host watchdog restart; no model, inference, build, or training process is running."
  acquisition_rule: "Measure disk headroom and require a safety reserve before downloads or training; block only the affected task."

