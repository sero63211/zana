[package]
name = "zana-desktop"
version = "0.1.0"
description = "ZANA local capability studio"
authors = ["ZANA contributors"]
edition = "2021"
rust-version = "1.85"

[workspace]
# The desktop app stays outside the shared Rust workspace so Tauri's native
# build graph remains independent of the zana-core workspace.

[lib]
name = "zana_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
